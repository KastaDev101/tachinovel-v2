# TachiNovel v2 CI. Free on a public repo; macOS jobs are the expensive ones, so they run only on pushes
# to main, pull requests and manual dispatch (no schedule while there is no Apple Developer account).
#
#  changes      ubuntu: docs-only pull request? (tools/ci-changes.ts) Then the macOS jobs are skipped.
#  web          ubuntu: typecheck, build both flavors, unit + core-in-vm tests, Xcode project check.
#  lint         ubuntu: ESLint (typescript-eslint, type-aware) on src/, tools/, tests/.
#  shell        ubuntu: PC shell test (WebKit + Capacitor native-bridge.js + built UI + built core).
#  ios-compile  macOS 26: Capacitor sync, unsigned SIMULATOR build (proves the Swift compiles), then a
#               simulator smoke test: install, launch, screenshot the first screens (artifact
#               "simulator-screenshots"); fails if the app crashes. Then the Swift gates: no new compiler
#               warnings (strict concurrency, baseline ci/swift-warnings-baseline.txt) and SwiftLint
#               (pinned, ci/swiftlint.sh); both via tools/swift-quality.ts.
#  ios-ipa      macOS 26 (PRs, pushes to main, manual): unsigned DEVICE build packaged as an .ipa for
#               sideloading with AltStore/SideStore and a free Apple ID (artifact
#               "TachiNovel-<version>-<run>-unsigned.ipa"). No signing, no entitlements.
#  voice-quality   macOS 26: HDVoice unit tests (swift test), then the BUNDLED Kokoro model loaded the way
#               the app does (kokoro-check): every offered voice x fixture sentences -> audio checks, time
#               to first audio, real-time factor, memory; ASR round trip with whisper.cpp (WER <= 15%).
#  voice-simulator macOS 26: the Debug app from ios-compile in the simulator with -tachiVoiceSelfTest:
#               Listen flow with Kokoro, sentence highlight, Apple fallback on a slow/failing Kokoro and back.
#  testflight   macOS 26: signed archive + TestFlight upload. Only on tags v* or manual dispatch with
#               upload=true, and skips cleanly until the App Store Connect secrets exist.
#
# The Kokoro model is bundled into the app but never committed: tools/fetch-voices.ts downloads the files
# pinned in ios/kokoro-models.lock.json (revision + SHA-256, fails on mismatch) into
# ios/App/App/KokoroModels/; the download cache is keyed by the lock file.
#
# Secrets (only for testflight): APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (Team key,
# Admin role), optional IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD / IOS_PROFILE_BASE64.
# Variables (optional): BUNDLE_ID (default com.kasta.tachinovel), FLAVOR (personal|store, default personal)

name: ios

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only pushes don't rebuild (saves macOS minutes; tag pushes ignore path filters).
    paths-ignore: ['docs/**', '**/*.md']
  # Pull requests always run every job: main is protected and requires web, shell, ios-compile and
  # ios-ipa, so a path filter here would leave docs-only PRs waiting forever.
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor
        type: choice
        options: [personal, store]
        default: personal
      upload:
        description: Upload to TestFlight (needs the App Store Connect secrets)
        type: boolean
        default: false

# A new push to a PR cancels that PR's older run. Runs on main are never cancelled (several PRs merge in
# a row; cancelling left main without a finished run or a green IPA); GitHub queues them instead and
# keeps only the newest pending one.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLAVOR: ${{ inputs.flavor || vars.FLAVOR || 'personal' }}
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.kasta.tachinovel' }}

jobs:
  # Docs-only pull requests (tools/ci-changes.ts) skip the macOS jobs; skipped jobs count as passing
  # required checks. Pushes, tags and manual runs always run everything. Fails safe (app=true).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then node tools/ci-changes.ts "origin/$BASE"; else node tools/ci-changes.ts --all; fi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node tools/build.ts --flavor=store
      - run: node tools/build.ts --flavor=personal
      - run: npm test
      - run: node tools/ios-project.ts --check

  # ESLint with typescript-eslint type-aware rules and per-context globals (eslint.config.js). Separate
  # from web so a lint finding and a test failure show up as two clear checks.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  shell:
    needs: web
    runs-on: ubuntu-latest
    # Playwright's image has WebKit and its system libraries preinstalled (apt-based --with-deps hung on
    # the first run); same version as the playwright-core devDependency.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:shell
        env:
          HOME: /root
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shell-screenshots
          path: .cache/shell-shots
          if-no-files-found: ignore
          retention-days: 14

  ios-compile:
    name: ios-compile + simulator smoke
    needs: [web, changes]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.changes.outputs.app != 'false' }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache the Kokoro model download
        uses: actions/cache@v6
        with:
          path: .cache/kokoro
          key: kokoro-${{ hashFiles('ios/kokoro-models.lock.json') }}
      - name: Bundled Kokoro model (pinned, checksummed)
        run: node tools/fetch-voices.ts
      - run: node tools/build.ts --flavor=${FLAVOR}
      - run: npx cap sync ios
      - name: Xcode version
        run: xcodebuild -version
      - name: Simulator build (unsigned)
        id: build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            CODE_SIGNING_ALLOWED=NO build | tee build/xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/xcodebuild.log
      - name: Keep the simulator app (voice-simulator job)
        run: ditto -c -k --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/App.app build/App-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: simulator-app
          path: build/App-simulator.zip
          retention-days: 3
      - name: Simulator smoke test (launch + screenshots)
        # The first simulator boot on a fresh runner migrates data for ~7 min.
        timeout-minutes: 16
        run: bash ci/ios-sim-smoke.sh build/DerivedData/Build/Products/Debug-iphonesimulator/App.app build/screenshots
        env:
          # Personal flavor ships the Stonescape source: also screenshot a live source list.
          SMOKE_SOURCE: ${{ env.FLAVOR == 'personal' && 'stonescape' || '' }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-screenshots
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-simulator-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
      # Swift gates run last (and even when the smoke test failed) so one run reports everything.
      - name: Swift warnings (new ones fail)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/swift-quality.ts warnings build/xcodebuild.log
      - name: SwiftLint
        if: ${{ !cancelled() }}
        run: bash ci/swiftlint.sh build/swiftlint.json && node tools/swift-quality.ts lint build/swiftlint.json

  ios-ipa:
    name: ios-ipa (unsigned, for AltStore)
    needs: [web, changes]
    # PRs too: it is a required check on main (a real device compile), and the PR's IPA can be tried first.
    # Docs-only PRs skip it (see the changes job).
    if: >-
      ${{ !cancelled() && needs.web.result == 'success' && needs.changes.outputs.app != 'false' &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache the Kokoro model download
        uses: actions/cache@v6
        with:
          path: .cache/kokoro
          key: kokoro-${{ hashFiles('ios/kokoro-models.lock.json') }}
      - name: Bundled Kokoro model (pinned, checksummed)
        run: node tools/fetch-voices.ts
      - run: node tools/build.ts --flavor=${FLAVOR}
      - run: npx cap sync ios
      - name: Unsigned device build → .ipa
        id: ipa
        run: bash ci/ios-unsigned-ipa.sh build/ipa
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Upload the .ipa
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.ipa.outputs.ipa }}
          archive: false
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Size report
        run: bash ci/ipa-size.sh "${{ steps.ipa.outputs.ipa }}" build/DerivedData-device/Build/Products/Release-iphoneos/App.app
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-device-log
          path: build/ipa/xcodebuild-device.log
          if-no-files-found: ignore
          retention-days: 7

  voice-quality:
    name: voice-quality (Kokoro on macOS + ASR)
    needs: web
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache the Kokoro model download
        uses: actions/cache@v6
        with:
          path: .cache/kokoro
          key: kokoro-${{ hashFiles('ios/kokoro-models.lock.json') }}
      - name: Bundled Kokoro model (pinned, checksummed)
        run: node tools/fetch-voices.ts
      - name: Fixture sentences (through the app's narration front-end)
        run: node tools/voice-fixtures.ts .cache/voice-fixtures.json
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ios/App/HDVoice/.build
          key: hdvoice-spm-${{ runner.os }}-${{ hashFiles('ios/App/HDVoice/Package.swift') }}
      - name: HDVoice unit tests (scheduler, PCM, preferences, crash sentinel, ...)
        run: swift test --package-path ios/App/HDVoice
      - name: Build kokoro-check
        run: swift build -c release --package-path ios/App/HDVoice --product kokoro-check
      - name: Kokoro check (every voice x fixtures, the app's loader)
        run: bash ci/voice-check.sh build/voice-check
      - name: Cache whisper.cpp
        uses: actions/cache@v6
        with:
          path: .cache/whisper
          key: whisper-v1.9.4-base.en-q8_0-${{ runner.os }}
      - name: ASR round trip (whisper.cpp v1.9.4, base.en q8_0)
        run: bash ci/voice-asr.sh build/voice-check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-check
          path: build/voice-check
          if-no-files-found: ignore
          retention-days: 14

  voice-simulator:
    name: voice-simulator (Listen flow + fallback in the simulator)
    needs: ios-compile
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: simulator-app
          path: build
      - run: ditto -x -k build/App-simulator.zip build
      - name: Voice self-test (simulator)
        timeout-minutes: 35
        run: bash ci/ios-voice-selftest.sh build/App.app build/voice-selftest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-selftest
          path: build/voice-selftest
          if-no-files-found: ignore
          retention-days: 14

  testflight:
    needs: ios-compile
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
    steps:
      - name: Secrets present?
        id: gate
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::notice::App Store Connect secrets are not configured; skipping the TestFlight upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci && node tools/fetch-voices.ts && node tools/build.ts --flavor=${FLAVOR} && npx cap sync ios
      - name: Archive, sign and upload
        if: steps.gate.outputs.ready == 'true'
        run: bash ci/ios-testflight.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Keep logs
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs
          path: build/*.log
          if-no-files-found: ignore

  # Pull requests that change the app (src/, ios/) add a changelog fragment (changelog.d/README.md);
  # docs/CI/dependency-only PRs just get a reminder. Fragment format errors fail here and in npm test.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Changelog fragment
        env:
          BASE: ${{ github.base_ref }}
        run: node tools/release.ts fragments-check "origin/$BASE"
