# UI crawler (docs/qa.md): taps every control of every reachable screen of the built app in WebKit
# (iPhone 16 Pro viewport, PC shell + mock native host, seeded synthetic library, fixed clock and seed,
# no network) in dark and light mode, and fails on new crashes, console errors, dead controls, hung
# taps, broken back navigation and layout escapes. Known issues (tests/crawler/known-issues.json) are
# reported but don't fail it.
#
# Runs on pull requests, nightly and on demand. Artifacts "ui-crawler-<scheme>": report.md (summary),
# report.json, a screenshot per state and per failure. The `ui-crawler` job is the single status to
# require on main; the per-scheme jobs do the work in parallel.

name: ui-crawler

on:
  pull_request:
  schedule:
    - cron: '17 6 * * *' # nightly, 06:17 UTC
  workflow_dispatch:

concurrency:
  group: ui-crawler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crawl:
    name: ui-crawler (${{ matrix.scheme }})
    runs-on: ubuntu-latest
    # Same image as the shell job: WebKit and its system libraries preinstalled, same Playwright version.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scheme: [dark, light]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Crawl
        run: node tools/ui-crawler.ts --flavor=personal --scheme=${{ matrix.scheme }} --out=.cache/crawler --quiet --max-minutes=30
        env:
          HOME: /root
      - name: Job summary
        if: always()
        run: |
          if [ -f .cache/crawler/report.md ]; then head -c 900000 .cache/crawler/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-crawler-${{ matrix.scheme }}
          path: .cache/crawler
          if-no-files-found: ignore
          retention-days: 14

  ui-crawler:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All schemes passed
        run: |
          if [ "${{ needs.crawl.result }}" != "success" ]; then
            echo "::error::The UI crawler found new failures (see the ui-crawler-<scheme> artifacts and job summaries)."
            exit 1
          fi
