# Release: a tag v<version> on a commit that is on main builds the unsigned sideload IPA and publishes a
# GitHub Release with that version's CHANGELOG notes. The repository is public, so releases are public.
# How to cut one: docs/release.md.
#
#  verify   ubuntu: the tagged commit is on main; tag == v<package.json version>; the Xcode project's
#           MARKETING_VERSION matches; CHANGELOG.md has a section for the version (→ release notes).
#  build    macOS 26: personal-flavor web build, cap sync, unsigned device build → TachiNovel-<version>-
#           unsigned.ipa (CFBundleVersion = this workflow's run number) + SHA256SUMS.txt. Read-only token.
#  publish  ubuntu: build provenance attestation for the IPA, then `gh release create` (pre-release when
#           the version has a suffix such as -alpha.1), then the AltStore source: apps.json (this IPA as
#           the newest version, tools/altstore-source.ts) on the rolling release "altstore-source", so
#           AltStore offers the update (stable URL in docs/how-to-test-tonight.md). The only job with
#           write access.
#
# The ios workflow also runs on the same tag (web checks, simulator smoke, TestFlight once secrets exist).
name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLAVOR: ${{ vars.FLAVOR || 'personal' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Tagged commit is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; tag a commit that has been merged."
            exit 1
          fi
      - name: Tag, version and changelog agree
        id: check
        run: node tools/release.ts verify-tag "$GITHUB_REF_NAME" --notes=release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  build:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache the Kokoro model download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kokoro
          key: kokoro-${{ hashFiles('ios/kokoro-models.lock.json') }}
      - name: Bundled Kokoro model (pinned, checksummed; docs/voices.md)
        run: node tools/fetch-voices.ts
      - run: node tools/build.ts --flavor=${FLAVOR}
      - run: npx cap sync ios
      - name: Unsigned device build → .ipa
        run: bash ci/ios-unsigned-ipa.sh build/ipa
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          IPA_NAME: TachiNovel-${{ needs.verify.outputs.version }}-unsigned.ipa
      - name: Checksum
        working-directory: build/ipa
        run: shasum -a 256 -- *.ipa > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ipa
          path: |
            build/ipa/*.ipa
            build/ipa/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-release-log
          path: build/ipa/xcodebuild-device.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.ipa
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            cat dist/release-notes.md
            echo
            echo '---'
            echo
            echo "**Install:** \`TachiNovel-${VERSION}-unsigned.ipa\` is an unsigned build for sideloading with AltStore or"
            echo 'SideStore and a free Apple ID (see docs/how-to-test-tonight.md). Not an App Store or TestFlight build.'
            echo
            echo "**Verify:** compare the SHA-256 with \`SHA256SUMS.txt\`, or run"
            echo "\`gh attestation verify TachiNovel-${VERSION}-unsigned.ipa --repo ${GITHUB_REPOSITORY}\`."
          } > notes.md
          flags=(--verify-tag --title "TachiNovel ${VERSION}" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.ipa dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" "${flags[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: AltStore source (rolling release "altstore-source")
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          ipa="dist/TachiNovel-${VERSION}-unsigned.ipa"
          # Versions, bundle id, minimum iOS and privacy strings come from the IPA's own Info.plist.
          python3 - "$ipa" > info.json <<'PY'
          import json, plistlib, re, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          name = next(n for n in z.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', n))
          p = plistlib.loads(z.read(name))
          print(json.dumps({
              'bundleId': p['CFBundleIdentifier'],
              'version': p['CFBundleShortVersionString'],
              'build': str(p['CFBundleVersion']),
              'minOS': p.get('MinimumOSVersion'),
              'privacy': {k: v for k, v in p.items() if re.fullmatch(r'NS\w+UsageDescription', k)},
          }))
          PY
          repo="$GITHUB_REPOSITORY"
          if ! gh release view altstore-source --repo "$repo" > /dev/null 2>&1; then
            gh release create altstore-source --repo "$repo" --title "AltStore source" --latest=false \
              --notes "AltStore source for TachiNovel (apps.json, rewritten by every release). In AltStore: Sources › + › https://github.com/${repo}/releases/download/altstore-source/apps.json"
          fi
          gh release download altstore-source --repo "$repo" --pattern apps.json --output previous.json || true
          node src/tools/altstore-source.ts --info=info.json --ipa="$ipa" \
            --url="https://github.com/${repo}/releases/download/${TAG}/TachiNovel-${VERSION}-unsigned.ipa" \
            --notes=dist/release-notes.md --previous=previous.json --label="$VERSION" --out=apps.json
          gh release upload altstore-source apps.json --clobber --repo "$repo"
