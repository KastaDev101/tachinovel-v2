# Dependabot version updates: weekly, grouped, so each ecosystem opens at most a few PRs a week (every PR
# runs the full CI, including two macOS jobs). Security updates are enabled separately in the repository
# settings and are not delayed by the cooldown below.
#
# Not covered on purpose:
#  - Swift packages: ios/App/CapApp-SPM/Package.swift is generated by `npx cap sync ios` from the npm
#    @capacitor/* versions (CI regenerates it before every build), so Capacitor's Swift package moves with
#    the npm "capacitor" group. When a hand-maintained Swift package lands (for example the on-device voice
#    engine), add a `package-ecosystem: swift` entry for its directory.
#  - Major versions: groups (except Capacitor, which must move together) take minor and patch updates
#    only, so a breaking major (TypeScript 7, actions/checkout v8...) arrives as its own PR that can be
#    reviewed or closed alone.
#  - The Playwright container image in .github/workflows/ios.yml (`mcr.microsoft.com/playwright:vX-noble`)
#    must match the `playwright-core` devDependency, so playwright-core is ignored here: bump both by hand
#    in one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: Deps
    groups:
      # Core, iOS runtime, CLI and plugins must stay on matching versions, majors included.
      capacitor:
        patterns: ['@capacitor/*']
      runtime:
        dependency-type: production
        exclude-patterns: ['@capacitor/*']
        update-types: [minor, patch]
      dev-tools:
        dependency-type: development
        exclude-patterns: ['@capacitor/*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: playwright-core

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 5
    commit-message:
      prefix: CI
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
